# Drivers on the boot path, built in so they probe as soon as the BPMP is up
# instead of waiting for the initrd or udev to load them.

# PCIe and NVMe, for the root filesystem.  As modules, the initrd loaded them
# and link training only started after /init ran.
CONFIG_PCIE_TEGRA194_HOST=y
CONFIG_PHY_TEGRA194_P2U=y
CONFIG_BLK_DEV_NVME=y

# Ethernet.  The robot can't start until eth0 has a link, and Gigabit
# autonegotiation takes 3 seconds after the interface comes up, so bring it
# up as early as possible.
CONFIG_R8169=y
CONFIG_REALTEK_PHY=y
