# BTF type information, so bpftrace can read kernel structures and attach
# fentry/fexit probes.  Needs pahole at configure and build time; see the
# bbappends.
CONFIG_DEBUG_INFO_BTF=y
CONFIG_MODULE_ALLOW_BTF_MISMATCH=y

# The kernel headers as a module, /sys/kernel/kheaders.tar.xz.  The bcc tools
# compile their BPF programs on the orin against them, and load the module
# when they need it.
CONFIG_IKHEADERS=m
