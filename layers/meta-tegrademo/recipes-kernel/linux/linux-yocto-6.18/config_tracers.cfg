# Latency tracers for the benchmark suite: osnoise measures what interrupts
# the CPU outside the measured threads, timerlat how late a timer's thread
# wakes.  Both are idle until enabled through tracefs.
CONFIG_OSNOISE_TRACER=y
CONFIG_TIMERLAT_TRACER=y

# The gact action ("action ok"), so the benchmark suite can count arriving
# packets with an ingress u32 filter.
CONFIG_NET_ACT_GACT=m
