# Subsystems the robot doesn't use.  Each one is built in by linux-yocto's
# defaults, so it costs boot time and memory even when nothing uses it.

# Audio.  The device tree's audio nodes are disabled too (see
# nvidia-kernel-oot-dtb_%.bbappend); NVIDIA's out-of-tree audio modules are
# only built when CONFIG_SND_SOC is set.
# CONFIG_SOUND is not set

# CONFIG_BT is not set
# CONFIG_JFFS2_FS is not set
# CONFIG_BTRFS_FS is not set
# CONFIG_NFS_FS is not set
# CONFIG_NFSD is not set
# CONFIG_IP_VS is not set

# Btrfs and MD RAID pull in the RAID6 library, which times every
# implementation at boot to pick one.
# CONFIG_RAID6_PQ_BENCHMARK is not set
