# https://wwwx.cs.unc.edu/~sparkst/howto/network_tuning.php
# Make the buffers big enough for an image
net.core.wmem_max=8388608
net.core.rmem_max=8388608

# Let sockets negotiate I-DATA (RFC 8260) so the message bridge can turn on
# SCTP_INTERLEAVING_SUPPORTED.  net.sctp only exists once sctp is loaded,
# hence etc/modules-load.d/sctp.conf.
net.sctp.intl_enable=1

# Once 16 KiB (by skb->truesize) from a socket is waiting in the qdisc and
# NIC, leave its new data in the SCTP stream scheduler (kernel patch 0014,
# like tcp_limit_output_bytes).  SCTP can't take back what it has queued below
# it, so otherwise stream priorities and fresh messages wait behind up to a
# whole cwnd.  0 turns the limit off.
net.sctp.limit_output_bytes=16384
