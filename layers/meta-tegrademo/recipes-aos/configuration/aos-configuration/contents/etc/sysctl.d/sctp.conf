# https://wwwx.cs.unc.edu/~sparkst/howto/network_tuning.php
# Make the buffers big enough for an image
net.core.wmem_max=8388608
net.core.rmem_max=8388608

# Let sockets negotiate I-DATA (RFC 8260) so the message bridge can turn on
# SCTP_INTERLEAVING_SUPPORTED.  net.sctp only exists once sctp is loaded,
# hence etc/modules-load.d/sctp.conf.
net.sctp.intl_enable=1
