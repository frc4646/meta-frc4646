# Once 16 KiB (by skb->truesize) from a socket is waiting in the qdisc and
# NIC, leave its new data in the SCTP stream scheduler (kernel patch 0014,
# like TCP small queues).  SCTP can't take back what it has queued below it,
# so otherwise stream priorities and fresh messages wait behind up to a whole
# cwnd.  0 turns the limit off.
options sctp limit_output_bytes=16384
